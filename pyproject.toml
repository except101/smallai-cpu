[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smallai-cpu"
version = "0.1.0"
description = "A Chinese language model trained from random weights on a CPU"
requires-python = ">=3.10"
dependencies = ["torch>=2.2,<3", "tokenizers>=0.20,<1", "numpy>=1.26,<3", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
data = ["duckdb>=1.3,<2"]

[project.scripts]
smallai = "smallai.cli:main"

[tool.setuptools.packages.find]
include = ["smallai*"]

[tool.setuptools.package-data]
smallai = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
